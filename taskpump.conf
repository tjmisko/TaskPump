# taskpump.conf — TaskPump driving its own generalization (dogfood ledger).
#
# The G phases track the work of making TaskPump consumable by any repository:
#   G1  neutral defaults (breaking flips; must precede the v0.1.0 tag)
#   G2  release v0.1.0 (the tag Arachne's F90.4 pins its submodule to)
#   G3  runner contract v2 + host decoupling (additive, 0.2.0)
#   G4  adoption path for existing repos (additive, 0.2.0)
#   G5  Arachne handoff coordination

TASKPUMP_TASKS_DIR=tasks
TASKPUMP_ID_PATTERN='^G[0-9]+(\.[0-9]+)?$'
TASKPUMP_PHASE_SIGIL=G
TASKPUMP_PHASE_SEPARATOR=.

# Identify ledger commits as this project's, not the historical default.
TASKPUMP_COMMITTER_NAME=tp-task
TASKPUMP_COMMITTER_EMAIL=task@taskpump.local

# What "is the tree broken?" means here, for future pump-driven drains.
TASKPUMP_BUILD_GATE='./tests/run-all.sh'
