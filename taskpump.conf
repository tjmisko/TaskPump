# taskpump.conf — TaskPump driving its own generalization (dogfood ledger).
#
# The G phases track the work of making TaskPump consumable by any repository:
#   G1  neutral defaults (breaking flips; must precede the v0.1.0 tag)
#   G2  release v0.1.0 (the tag Arachne's F90.4 pins its submodule to)
#   G3  runner contract v2 + host decoupling (additive, 0.2.0)
#   G4  adoption path for existing repos (additive, 0.2.0)
#   G5  Arachne handoff coordination
#
# Sections below the ledger block are the G0.2 launch-path pins: every key a
# real launch on this repository needs that would otherwise assume an Arachne
# artifact. Style follows examples/arachne.conf — each pin carries one line of
# why, and "# (default)" marks a value the tool ships with today.

# ── Ledger ───────────────────────────────────────────────────────────────────
#
# The ledger IS this repository — tasks/ lives beside the code it tracks. The
# root is self-located from the discovered conf's own directory (config.sh sets
# TP_CONFIG_FILE before sourcing), so the checked-in file carries no home path.
# Consequence, validated in G0.4: the runner collapses its :ro-primary + RW-
# ledger mounts into ONE read-write mount of this checkout, so the read-only-
# primary hardening does NOT apply to the dogfood repo (the entrypoint's mount
# self-check warns — expected). Ledger commits are atomic under the state
# flock, so fs-guard stays clean.
TASKPUMP_LEDGER_REPO="$(CDPATH='' cd -- "$(dirname "${TP_CONFIG_FILE:-$PWD/taskpump.conf}")" && pwd)"

# Absolute on purpose, derived from the pin above. The pump forwards this value
# into every container, where env beats the worktree's own conf copy — that is
# what makes ALL agents write the ONE shared ledger (this checkout, on main)
# instead of each worktree's private tasks/ copy, which the pump's frontier on
# the primary would never see. A relative `tasks` here resolves to the agent's
# worktree and splits the ledger brain.
TASKPUMP_TASKS_DIR="$TASKPUMP_LEDGER_REPO/tasks"

# The next-task JSON drop. The default lands at the tasks dir's parent — here
# the repo root, where it is untracked dirt fs-guard would flag every tick, and
# one file shared by every concurrent agent. /tmp is container-private, so each
# agent gets its own.
TASKPUMP_TASK_OUT="${TMPDIR:-/tmp}/.taskpump-next-task"

TASKPUMP_ID_PATTERN='^G[0-9]+(\.[0-9]+)?$'
TASKPUMP_PHASE_SIGIL=G
TASKPUMP_PHASE_SEPARATOR=.

# Identify ledger commits as this project's, not the historical default.
TASKPUMP_COMMITTER_NAME=tp-task
TASKPUMP_COMMITTER_EMAIL=task@taskpump.local

# ── Task CLI ─────────────────────────────────────────────────────────────────
#
# This repo vendors its own CLI by definition — but the pin is the VERB-LEVEL
# tool, not bin/tp. The entrypoint execs '$TASK_CLI' as a single word with the
# verb appended ('$TASK_CLI' claim ...), and the brief quotes the same
# spelling; `bin/tp` needs the `task` subcommand word, so its claim/heartbeat
# calls would no-op under the entrypoint's `|| true` (the G1.6 flag). G0.2's
# spec named bin/tp — deviation recorded in its completion notes.
TASKPUMP_TASK_CLI=libexec/tp-task
TASKPUMP_WORKSPACE_TASK_CLI=libexec/tp-task

# ── Runner ───────────────────────────────────────────────────────────────────
#
# The dogfood agent image: minimal image contract (docs/RUNNERS.md §4.0) plus
# what libexec/tp-task itself needs inside the container (bash, git, mikefarah
# yq v4, jq, gawk). Built from the runner's own directory so the entrypoint
# bakes at the default /entrypoint.sh path; the shipped default build command
# expects a Dockerfile at the repo root, which this repo does not have.
TASKPUMP_IMAGE=taskpump-agent
TASKPUMP_IMAGE_BUILD='docker build -t taskpump-agent -f runners/claude-docker/Dockerfile runners/claude-docker'
#
# No TASKPUMP_PRE_FLIGHT is wired yet, so NO egress allowlist is installed in
# the container — the Auto Mode classifier is the only layer. Supervised runs
# only until a dogfood pre-flight exists (its own task when the tick exposes
# the need).
#
# Fallback if the dogfood image stalls: ride the Arachne image, whose layout
# bakes the historical entrypoint path.
# TASKPUMP_IMAGE=arachne
# TASKPUMP_ENTRYPOINT=/entrypoint-parallel.sh

# ── Pump ─────────────────────────────────────────────────────────────────────
#
# Serial until a full supervised drain of one phase has been watched end to
# end (G0.2). An explicit --jobs on the command line overrides this pin.
TASKPUMP_JOBS=1

# What "is the tree broken?" means here, for future pump-driven drains.
TASKPUMP_BUILD_GATE='./tests/run-all.sh'
