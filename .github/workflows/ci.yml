name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # mikefarah's yq (Go), NOT the Python `yq` — they share a name and share
  # nothing else. The whole ledger is read and written through its
  # `--front-matter=extract|process` modes, which the Python one does not have.
  # Pinned to a v4 patch release: v4 is the API the tools are written against,
  # and floating to `latest` means a future v5 silently breaks every read.
  YQ_VERSION: v4.44.3

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: Lint shell sources
        run: |
          # Severity is pinned to `warning`, and the count is ZERO (G2.4
          # cleared the 59 findings the tree carried out of extraction).
          # This is the ratchet the original `-S error` pin promised: any
          # warning this reports is one somebody just introduced. The
          # severity never widens back to `error` — loosening it to make a
          # change pass is the one thing this must not be used for.
          files=$(find bin libexec lib gates runners hooks \
                    -type f \( -name '*.sh' -o -perm -u+x \) 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "no shell sources found — the layout moved?" >&2
            exit 1
          fi
          echo "$files"
          # -x follows `source`d files so the shared lib/ code is analysed in
          # the context of each tool that sources it.
          # shellcheck disable=SC2086
          shellcheck -S warning -x $files

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # gawk: the DAG layout engine is a gawk program; ubuntu ships mawk by
          # default, which lacks the array and printf behaviour it relies on.
          # jq, git, util-linux (flock, and logger — the headless
          # TASKPUMP_NOTIFY_CMD docs/CONFIG.md ships), coreutils (timeout),
          # findutils (xargs, which the desktop notifier recipe in the same
          # section is built from and which the pump suite drives through a real
          # tick) are already present on the runner; naming them here makes a
          # change in the runner image fail at this step rather than deep inside
          # a suite.
          sudo apt-get install -y --no-install-recommends gawk jq git util-linux coreutils findutils
          gawk --version | head -1
          jq --version

      - name: Install yq ${{ env.YQ_VERSION }} (mikefarah)
        run: |
          url="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo curl -fsSL --retry 3 -o /usr/local/bin/yq "$url"
          sudo chmod +x /usr/local/bin/yq
          yq --version
          # Fail loudly rather than 300 confusing assertion failures if the
          # Python yq ever shadows this one.
          yq --version 2>&1 | grep -q mikefarah \
            || { echo "wrong yq on PATH — need mikefarah's Go implementation" >&2; exit 1; }

      - name: Configure git identity
        run: |
          # The suites build throwaway repositories and commit in them.
          git config --global user.name  "TaskPump CI"
          git config --global user.email "ci@taskpump.invalid"
          git config --global init.defaultBranch main

      - name: Run the suites
        run: ./tests/run-all.sh

      - name: Generic-consumer smoke
        run: |
          # Drives the read-only verbs over tests/fixtures/generic-project — a
          # project with a different tasks directory, a different id grammar,
          # and no relationship to the repo TaskPump was extracted from. It is
          # also the tree every example in README.md runs against, so this step
          # is what keeps the quickstart from going stale.
          cd tests/fixtures/generic-project
          tp() { "$GITHUB_WORKSPACE/bin/tp" "$@"; }

          assert_eq() {
            if [ "$2" != "$3" ]; then
              echo "FAIL: $1 — expected '$3', got '$2'" >&2
              exit 1
            fi
            echo "ok: $1 = $2"
          }

          assert_eq "ready --count"          "$(tp task ready --count)"          "3"
          assert_eq "ready --count-eligible" "$(tp task ready --count-eligible)" "1"
          assert_eq "next"                   "$(tp task next --branch feat/t2 | jq -r .id)" "T2.1"

          # scrub is the only verb that reports a task file invisible to the
          # frontier, and exits 3 when it finds one. A clean fixture exits 0.
          tp task scrub

          # ── The create path ──────────────────────────────────────────────
          # Everything above reads. `create` is the verb that writes a new task,
          # and the only one that enforces TASKPUMP_ID_PATTERN — so it is where a
          # consumer whose ids are not F-shaped finds out whether the grammar is
          # really configurable, or whether the extraction left an F baked in.
          #
          # It runs against a COPY. The committed fixture is the tree every
          # README example and every assertion above is written against; a step
          # that grew a task in it would change those counts for the next run and
          # leave the diff for someone else to explain.
          tmproot="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$tmproot"
          work="$(mktemp -d "$tmproot/tp-smoke.XXXXXX")/generic-project"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/generic-project" "$work"
          cd "$work"

          tp task create T4.1 \
            --title "smoke: the create path lands a task" \
            --phase T4 \
            --goal  "prove a consumer's own id grammar reaches the write path"

          [ -f tasks/T4.1.md ] || { echo "FAIL: create wrote no task file" >&2; exit 1; }
          echo "ok: create wrote tasks/T4.1.md"

          # It has to reach the frontier, not just the filesystem. A file the
          # ledger cannot parse is invisible rather than an error, so counting is
          # the assertion that a written task is a real one.
          assert_eq "ready --count after create" "$(tp task ready --count)" "4"
          assert_eq "goal round-trips" \
            "$(tp task goal T4.1)" \
            "prove a consumer's own id grammar reaches the write path"

          # The grammar has to reject as well as accept, or it is not enforcing
          # anything. F45.23 is the shape TaskPump was extracted with, which is
          # exactly the shape this consumer must not silently inherit.
          if tp task create F45.23 --title "wrong grammar for this consumer" 2>/dev/null; then
            echo "FAIL: create accepted an id the configured pattern rejects" >&2
            exit 1
          fi
          echo "ok: create rejects an id outside TASKPUMP_ID_PATTERN"

          # The committed fixture must be exactly as checked out.
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- tests/fixtures/generic-project; then
            echo "FAIL: the smoke mutated the committed fixture" >&2
            git diff --stat -- tests/fixtures/generic-project >&2
            exit 1
          fi
          echo "ok: committed fixture untouched"

          echo "generic-consumer smoke passed"
