# taskpump.conf — the generic-consumer smoke fixture.
#
# The smallest configuration that makes TaskPump drive a project which is not
# Arachne. Since the v0.1.0 default flips (G1.6), a project keeping its ledger
# in tasks/ with T-shaped ids needs NO ledger keys at all: the tasks directory
# resolves through the default TASKPUMP_LEDGER_PROBE (tasks), anchored to this
# file's directory, and ids validate against the default TASKPUMP_ID_PATTERN
# (^T[0-9]+(\.[0-9]+)?$). This file's presence is still load-bearing — it marks
# this directory as its own workspace — but everything it used to spell out
# about the ledger's shape is now the shipped default.
#
# What remains is only what this fixture's unusual position requires:

# The repository whose commits the heartbeat productivity check measures. Here it
# is the fixture itself; in a real project it is your source repo, which is
# frequently NOT the repo holding the ledger.
TASKPUMP_CODE_REPO=.

# This fixture is not a git repository, so state mutations are written to disk
# and the commit is skipped. Set explicitly so a copy of this tree placed inside
# a repository does not start committing to it by surprise.
TASKPUMP_TASK_NOCOMMIT=1
