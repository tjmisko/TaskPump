# minimal.conf — a commented starting point for diverging from the defaults.
#
# Copy to `taskpump.conf` at the root of your repository.
#
# You may not need this file at all. A repository that keeps its ledger in
# `tasks/` with `T`-shaped ids (T3, T3.1) works bare — the two keys below only
# restate the shipped defaults. A conf is how you diverge; add keys when a
# default is wrong for you, not in anticipation — `taskpump.conf.example` is
# the full census, and docs/CONFIG.md explains the groups.

# Where the ledger lives, relative to this file. (Default: tasks)
TASKPUMP_TASKS_DIR=tasks

# The id grammar. Must accept both shapes: PHASE (T3) and PHASE.N (T3.1).
# The sigil is yours; the shape is the contract (docs/LEDGER-CONTRACT.md §7).
# If you change the sigil, set TASKPUMP_PHASE_SIGIL to match.
# (Default: ^T[0-9]+(\.[0-9]+)?$)
TASKPUMP_ID_PATTERN='^T[0-9]+(\.[0-9]+)?$'

# ── Worth setting early, once you are running agents ─────────────────────────
#
# The command that decides whether the tree is broken. It gates integration, so
# it should be the check you would not merge without — and fast enough to run
# repeatedly.
# TASKPUMP_BUILD_GATE='npm test'
#
# The image agents launch from. No default — a real run refuses loudly without
# it (--dry-run works imageless).
# TASKPUMP_IMAGE=my-project-agent
#
# Where per-agent worktrees are created.
# TASKPUMP_PUMP_WORKTREES_DIR=.worktrees
#
# How many agents may run at once. Start at 1 and raise it once you have watched
# a real drain; the interesting failures are all concurrency failures.
# TASKPUMP_JOBS=1
#
# (TASKPUMP_PUMP_JOBS is a different key — the systemd unit's name for the same
# number, which it passes as --jobs. Setting it here changes nothing.)
