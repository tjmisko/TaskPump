# arachne.conf — the reference consumer's real configuration.
#
# Arachne is the project TaskPump was extracted from on 2026-08-06, and remains
# its reference consumer. These are the values a multi-day unattended drain
# actually ran with, not an illustration — with two marked departures, each
# explained where it happens:
#
#   * the runner block shows the current entrypoint + pre-flight contract
#     instead of the pre-extraction /entrypoint-parallel.sh layout (issue #5);
#   * TASKPUMP_JOBS stays at the shipped default, because the wide drains
#     always widened the cap per invocation with --jobs, never ambiently
#     (issue #8).
#
# It is here for two reasons. It is the worked example of a fully-configured
# consumer — a Rust workspace, a submodule ledger, Docker-sandboxed agents. And
# most of these keys are not preferences: each one is a default that some earlier
# run got wrong. The comments say which.
#
# Annotations. Each one is verified against the cited source by
# tests/test-example-confs.sh, so these comments cannot silently rot through
# the next default flip (which is what happened at G1.3 — issue #4):
#
#   # (default — file:line)
#       restates the value the tool ships with today, read at the cited line.
#       Deleting the line changes nothing.
#   # (pin; shipped default: X — file:line)
#       load-bearing: the v0.1.0 default flips moved this key's baked-in
#       default to the neutral TaskPump spelling X, and this line is what holds
#       the consumer's historical behavior fixed. Deleting it renames a file
#       some other system matches on by name, or changes behavior mid-run —
#       a minimal-conf cleanup must keep every one of these.
#   # (computed default: … — file:line)
#       the default is computed at run time, so there is no literal to compare;
#       the cited line is the computation.
#
# Cited files live in libexec/ (tp-task, tp-pump, tp-monitor), lib/
# (pump-lib.sh), gates/ (claude-usage), and runners/claude-docker/
# (entrypoint.sh). Line numbers are as of this writing; the test compares
# values, not line numbers, so a drifted citation is a nuisance and a drifted
# value is a failure.
#
# To use: copy to `taskpump.conf` at the root of the Arachne checkout.

# ── Ledger ───────────────────────────────────────────────────────────────────
#
# The ledger lives in the `ops/` submodule — a SEPARATE repository from the code.
# That split is deliberate: task state churns on every claim and heartbeat, and
# mixing that traffic into the code repository's history makes both harder to
# read. It is also why TASKPUMP_CODE_REPO must be set independently below.
TASKPUMP_TASKS_DIR=ops/task-loop/tasks
TASKPUMP_LEDGER_REPO=ops

# How a workspace is recognized as having its own ledger. Every worktree carries
# both its own copy of the tools AND its own ops/ checkout, so "which ledger does
# this invocation write to" is answered by probing $PWD's worktree for this path.
# Getting this wrong is the 2026-08-01 incident: the primary checkout's CLI, run
# from inside a worktree, wrote that worktree's claim into the PRIMARY's ledger.
# The work was in one place and the record of it in another, and the primary's
# ledger drifted 46 commits ahead of anything it described.
TASKPUMP_LEDGER_PROBE=ops/task-loop/tasks    # (pin; shipped default: tasks — tp-task:60)

# The path that proves the ops/ submodule is populated in a freshly-created
# worktree, so the pump can skip its per-worktree `submodule update --init
# --recursive`. Pinned to the historical value; the shipped default is now
# UNSET, which always runs the (idempotent) init. Beware the skip-trap this key
# carries: the probe answers as soon as ITS path exists, so with a second
# submodule (F90.4 vendors TaskPump at taskpump/) a worktree whose ops/ is
# populated but whose taskpump/ is not still reads "populated" and the init is
# skipped — an exec shim into an empty directory, mid-drain, with no
# diagnostic. When a second submodule lands, either drop this pin (always
# init) or point it at a path that proves BOTH are populated.
TASKPUMP_SUBMODULE_PROBE=ops/planning/STATUS.md   # (pin; shipped default: none — tp-pump:102)

# The repository whose commits the heartbeat productivity check measures — the
# code, not the ledger. Every ledger mutation is itself a commit, so pointing
# this at the ledger would make every heartbeat look productive and disarm the
# consecutive-failure tripwire entirely.
TASKPUMP_CODE_REPO=.                         # (computed default: the resolved repo root — tp-task:100)

# Phase-anchored ids: F45, F45.23. Arachne deliberately has no parallel #N
# scheme — one id space, anchored to the phase that owns the work.
TASKPUMP_ID_PATTERN='^F[0-9]+(\.[0-9]+)?$'   # (pin; shipped default: ^T[0-9]+(\.[0-9]+)?$ — tp-task:114)

# The parsing half of the same grammar: what the monitor and the DAG renderer
# split an id on to group it under a phase. ID_PATTERN says which ids are valid;
# these say where the phase ends. All three have to agree.
TASKPUMP_PHASE_SIGIL=F                       # (pin; shipped default: T — tp-task:115)
TASKPUMP_PHASE_SEPARATOR=.                   # (default — tp-monitor:146)

# Reclaim a claim whose last heartbeat is older than this. Catches the case
# process-liveness cannot see: a container that is alive but hung, which will
# never fire another heartbeat and would otherwise hold its claim forever.
TASKPUMP_CLAIM_STALE_HOURS=24                # (default — tp-task:120)

# Push ledger state as it changes, so a supervisor watching from elsewhere sees
# claims and completions live. Contended pushes retry with jittered backoff —
# a dozen agents pushing small commits to one ref collide constantly. The
# shipped default is local-first (no push); this pin is what keeps Arachne's
# ledger observable from outside the host.
TASKPUMP_TASK_PUSH=1                         # (pin; shipped default: 0 — tp-task:104)
TASKPUMP_PUSH_RETRIES=6                      # (default — tp-task:126)

# The cross-agent state lockfile, flocked in the ledger's git root and shared by
# inode across every container that bind-mounts the repo. Pinned to the
# historical name: agents exclude each other only while they all resolve the
# SAME name, so an upgrade that renamed it under a live drain would split the
# fleet across two locks and reopen the claim race the lock exists to close.
TASKPUMP_LOCK_NAME=.arachne-task.lock        # (pin; shipped default: .taskpump-task.lock — tp-task:125)

# The identity on ledger commits, and the name the CLI answers to in its own
# diagnostics. Historical spellings, pinned: bookkeeping stays separable from
# authored work only if the author string is uniform across the whole ledger
# history, and anything scraping logs by the diagnostic prefix keeps matching.
TASKPUMP_COMMITTER_NAME=arachne-task         # (pin; shipped default: tp-task — tp-task:110)
TASKPUMP_COMMITTER_EMAIL=task@arachne.local  # (pin; shipped default: task@taskpump.local — tp-task:111)
TASKPUMP_PROG_NAME=arachne-task              # (pin; shipped default: tp-task — tp-task:131)

# The pump's self-identity is the same promise one tool over: its diagnostic
# prefix, the plan header, the notify-send title, and the transient systemd
# unit name all derive from this key, and operators script against
# `journalctl --user -u arachne-pump-*` and grep the pump log by the prefix.
TASKPUMP_PUMP_PROG_NAME=arachne-pump         # (pin; shipped default: tp-pump — tp-pump:234)

# ── Workspaces ───────────────────────────────────────────────────────────────
#
# TASKPUMP_WORKTREES_DIR is deliberately left unset. The pump reads it as a path
# and the monitor and cleanup read it as a bare directory name, so one value
# cannot be right for all three; each tool's own default already resolves to the
# same `.worktrees` under the repo root.
TASKPUMP_BRANCH_PREFIX=feat/                 # (default — tp-pump:180)
TASKPUMP_PUMP_BASE=main                      # (default — tp-pump:181)

# ── Runner ───────────────────────────────────────────────────────────────────
#
# Docker, with the hardened reference runner. TASKPUMP_RUNNER is a path to an
# executable, not a runner name — the shipped claude-docker runner is the
# default, so this stays commented.
# TASKPUMP_RUNNER=/path/to/runners/claude-docker/runner.sh
#
# The image has NO shipped default: a real run (never --dry-run) aborts loudly
# before any launch when it is unset. The agent-name prefix is what liveness
# enumeration matches on, so it must be distinctive on the host — the pump asks
# "which containers are alive", never "which tasks say in_progress". The
# trailing dash is part of the value.
TASKPUMP_IMAGE=arachne                       # (pin; shipped default: none — tp-pump:110)
TASKPUMP_AGENT_PREFIX=arachne-agent-         # (pin; shipped default: tp-agent- — pump-lib.sh:214)

# TASKPUMP_ENTRYPOINT is deliberately NOT set — a departure from the historical
# drives, which pinned Arachne's pre-extraction /entrypoint-parallel.sh here.
# That entrypoint predates the pre-flight hook: under it, TASKPUMP_PRE_FLIGHT
# below is read by nothing, and the firewall / settings merge / smoke test only
# happen because they are still inlined in the legacy entrypoint — correct-
# looking for the wrong reason, and wrong the moment the pin outlives the
# legacy image (issue #5). The shipped default, /entrypoint.sh (tp-pump:114),
# is where the image contract bakes TaskPump's own entrypoint
# (docs/RUNNERS.md §4.0):
#
#     COPY runners/claude-docker/entrypoint.sh /entrypoint.sh
#
# Only that entrypoint honors the pre-flight hook. An image that has not yet
# baked it must keep running its legacy entrypoint via this key — and must then
# treat TASKPUMP_PRE_FLIGHT as inert.

# How an agent invokes the ledger CLI from its workspace — two keys, one path.
# TASKPUMP_TASK_CLI is the spelling the pump quotes into briefs;
# TASKPUMP_WORKSPACE_TASK_CLI is what the entrypoint actually execs inside the
# container. Arachne vendors the CLI in-repo, so both stay the checked-in script.
TASKPUMP_TASK_CLI=scripts/arachne-task            # (pin; shipped default: tp task — tp-pump:144)
TASKPUMP_WORKSPACE_TASK_CLI=scripts/arachne-task  # (pin; shipped default: tp — entrypoint.sh:138)

# Project-shaped setup between "container exists" and "agent starts": the
# egress firewall, the agent-settings merge, the Rust toolchain on PATH, then
# the image smoke test. Keeping this in a consumer hook is what lets the runner
# itself stay generic. The path is resolved INSIDE the container, where the
# entrypoint has already cd'd to the workspace — so this relative path names a
# script in the checkout, not on the host. The script is Arachne's to create:
# start from runners/claude-docker/preflight-example.sh, which is those same
# steps lifted verbatim from the legacy entrypoint.
TASKPUMP_PRE_FLIGHT=./scripts/taskpump-preflight.sh

# ── Build gate ───────────────────────────────────────────────────────────────
#
# What must pass before work is integrated. `cargo check --workspace` catches the
# cross-crate breakage that batch-merging parallel branches produces: each branch
# is clean against main on its own, and the sibling struct-literal cascades only
# appear once two of them are on the same tree.
TASKPUMP_BUILD_GATE='cargo check --workspace && ./smoke_test.sh'

# Reclaim build output from a finished workspace each tick. A Rust target/ dir is
# gigabytes; a multi-day drain across several worktrees has filled a disk (195G,
# 100% used, observed). Unset, the reclaim pass is a no-op — this pin is what
# arms it (and tp-cleanup's --targets sweep) for Arachne; `cargo clean` never
# removes anything unrecoverable.
TASKPUMP_RECLAIM_CMD='cargo clean'
TASKPUMP_DISK_RECLAIM=1                      # (default — tp-pump:1361)

# What a task must leave green before it may be called done. Quoted into every
# brief, so the agent is told the bar rather than inferring it. The shipped
# default is now empty (the brief's verify sections drop out entirely without
# this); this pin is what keeps Arachne's bar in its briefs.
TASKPUMP_VERIFY_CMDS='cargo fmt --all
cargo clippy --workspace -- -D warnings'

# ── Briefs ───────────────────────────────────────────────────────────────────
#
# One parameterized template for every phase, rather than a hand-written brief
# per worktree. The agent reads the task file itself for goal, scope, and
# acceptance — so a range run needs no manifest and no per-phase authoring.
#
# Both pins name a path inside this ledger. Until issue #37 the pump PROBED that
# directory on its own, so the resume note rendered from ops/task-loop/briefs/
# without anyone asking for it — a rung that only ever existed because this
# consumer's layout was the tool's layout. The probe is gone; keeping the same
# rendered bytes now means saying so here, which is also the migration any other
# project that leaned on the probe should make.
TASKPUMP_BRIEF_TEMPLATE=ops/task-loop/briefs/_phase-drain-template.md   # (computed default: <install>/templates/phase-drain-brief.md — tp-pump:1172)
TASKPUMP_RESUME_TEMPLATE=ops/task-loop/briefs/_resume-note-template.md  # (computed default: <install>/templates/resume-note.md — tp-pump:1200)

# ── Pump ─────────────────────────────────────────────────────────────────────
#
# Concurrency is capped and rotated, not bursted — and the UNFLAGGED cap stays
# at the shipped default. The historical drains that ran wider always said so
# explicitly (`tp pump --phases … --jobs 6`); putting 6 here instead would
# silently widen every invocation that did not ask — --once ticks, ad-hoc
# dry-runs turned real, the systemd unit with TASKPUMP_PUMP_JOBS unset — which
# is issue #8, and in exactly the direction where this host's failure mode
# lives. Six IS the proven ceiling here, and it is a hardware limit, not a
# preference: the Apple-Silicon WiFi firmware wedges under the aggregate packet
# load of ~10 simultaneous streaming agents (RX-ring SKB starvation, cleared
# only by a device reset). Raise the cap per run with --jobs 6, or mid-run
# through the pool-cap file below — never ambiently here.
TASKPUMP_JOBS=4                              # (default — tp-pump:168)
TASKPUMP_POOL_CAP_FILE=.arachne-pool-cap     # (pin; shipped default: .taskpump-pool-cap — tp-pump:216)

# No-progress resumes of a stalled claim before escalating to a human. A resume
# that produces a commit resets the count, so this bounds futility rather than
# duration — a task legitimately needing many sessions is never escalated.
TASKPUMP_PUMP_RESUME_MAX=3                   # (default — tp-pump:209)

# Consecutive fully-deadlocked ticks before exiting 3. Greater than one so a
# container dying mid-tick cannot trip it. Before this existed, a pump idled 563
# ticks over seven hours on a single orphaned claim while systemd reported it
# healthy — the incident the whole resume mechanism comes from.
TASKPUMP_PUMP_STALL_EXIT_TICKS=3             # (default — tp-pump:212)

# The state file's NAME within the state dir. TASKPUMP_PUMP_STATE_FILE is the
# other key — an absolute path that overrides the state dir entirely — and a
# bare filename there would resolve against the current directory instead.
TASKPUMP_PUMP_STATE_NAME=.arachne-pump.state # (pin; shipped default: .taskpump-pump.state — tp-pump:225)

# Every other file a run drops, under its historical name. Every one of these
# is a PIN: the v0.1.0 filename flip (G1.3) moved each shipped default to a
# .taskpump-* spelling, so deleting any line here renames a live run's file
# mid-drain. The agent-log NAME is load-bearing twice over: the monitor and the
# cleanup sweeper find a live agent by this filename, so a rename landing
# mid-drain would make running agents invisible to both. The last four resolve
# like the pool cap above: the shipped default anchors each in the state dir,
# and Arachne runs the pump from the repo root, where the state dir already is.
TASKPUMP_AGENT_LOG_NAME=.arachne-agent.log   # (pin; shipped default: .taskpump-agent.log — tp-pump:153)
TASKPUMP_BRIEF_OUT_NAME=.arachne-phase-brief.md   # (pin; shipped default: .taskpump-phase-brief.md — tp-pump:154)
TASKPUMP_GOAL_NOTE_NAME=.arachne-goal.md     # (pin; shipped default: .taskpump-goal.md — tp-pump:158)
TASKPUMP_RESUME_NOTE_NAME=.arachne-resume.md # (pin; shipped default: .taskpump-resume.md — tp-pump:155)
TASKPUMP_RO_PROBE_FILE=.arachne-rotest       # (pin; shipped default: .taskpump-rotest — entrypoint.sh:173)
TASKPUMP_PUMP_LOG=.arachne-pump.log          # (pin; shipped default: .taskpump-pump.log — tp-pump:226)
TASKPUMP_USAGE_RESET_FILE=.arachne-usage-reset    # (pin; shipped default: .taskpump-usage-reset — tp-pump:217)
TASKPUMP_DISK_WATCHDOG_LOG=.arachne-disk-watchdog.log   # (pin; shipped default: .taskpump-disk-watchdog.log — tp-pump:162)
TASKPUMP_HOOK_MARK_FILE=.arachne-fsguard.notified       # (pin; shipped default: .taskpump-fsguard.notified — tp-pump:161)

# ── Gates ────────────────────────────────────────────────────────────────────
#
# Arachne runs the default chain, so TASKPUMP_GATES is deliberately NOT set. The
# key takes newline-separated command lines whose first word is an executable
# path — a comma-separated list of bare gate names is skipped entry by entry with
# a warning, and a skipped gate reads exactly like a gate that passed. Setting it
# also REPLACES the chain rather than adding to it, so the way to drop one gate
# is its own enable flag below, not this key.
#
# The chain Arachne runs, cheapest-first; the first gate to pause short-circuits
# it:
#
#   net-health          host WiFi wedge — HOST HARDWARE POLICY, shipped OFF.
#                       The TASKPUMP_HEALTH_GATE=1 pin below is what opts it in
#                       (first) for this machine: it matches brcmfmac firmware
#                       signatures specific to this hardware. Its recovery half
#                       (the modprobe reset) deliberately stays consumer-side in
#                       arachne-net-watchdog: detecting is a feed decision,
#                       reloading a kernel module is not TaskPump's business.
#   claude-token-fresh  containers are access-token-only and cannot self-refresh,
#                       so launching one against an expiring host token yields an
#                       agent that 401s immediately and burns a relaunch cycle.
#   claude-usage        plan utilization ceiling — what makes a multi-day drain
#                       self-throttling instead of plan-exhausting.
#   disk-low            free space floor, shared with the reclaim threshold.
TASKPUMP_HEALTH_GATE=1                       # (pin; shipped default: 0 — tp-pump:177)
TASKPUMP_TOKEN_GATE=1                        # (default — pump-lib.sh:504)
TASKPUMP_TOKEN_MARGIN_S=600                  # (default — pump-lib.sh:505)
TASKPUMP_USAGE_GATE=1                        # (default — claude-usage:228)
TASKPUMP_USAGE_CEILING=95                    # (default — tp-pump:169)
TASKPUMP_DISK_GATE=1                         # (default — pump-lib.sh:447)

# ── Pre-tick hooks ───────────────────────────────────────────────────────────
#
# Also left unset, and for the same two reasons: the value is newline-separated
# command lines, and setting it replaces the default pair rather than extending
# it. Both shipped hooks are ones Arachne needs, so replacing the chain to name
# them is a way to lose them.
#
#   gitignore-repair the `gh worktree` extension appends a bare `.worktrees/`
#                    ignore line on every create, which sits after the negations
#                    that keep worktrees visible and silently re-ignores them.
#                    Left alone it produces a perpetually-dirty tree and a
#                    self-triggering guard loop; it has stalled a live pump and
#                    burned multiple rescue sessions.
#   fs-guard         contamination detector. With the primary checkout mounted
#                    read-only a container cannot write it, so this should always
#                    be clean — it is the regression detector for a future mount
#                    change that re-widens the mount.
#
# Fast-forwarding ops/ and running `scrub` are NOT hooks: the pump does both
# itself at the top of every tick, before the hook chain runs.

# Paths allowed to be dirty in the primary checkout. Anything else dirty means a
# container wrote where it should not have. The trunk's lock and quarantine files
# are in the list because the integration trunk below writes them into the repo
# root every merge — dropping them makes fs-guard fire on the pump's own work.
TASKPUMP_FS_GUARD_ALLOWLIST='^(\.worktrees/|ops$|ops/|\.auto-trunk\.lock$|\.auto-trunk-quarantine$)'   # (default — pump-lib.sh:572)

# ── Integration trunk (opt-in, default OFF) ──────────────────────────────────
#
# When enabled, phase worktrees are cut from a continuously-integrated trunk
# rather than a stale base, each quiescent phase merges into it behind the build
# gate, and the drain graduates as one PR. The flock is the merge queue: every
# container shares the bind-mounted repo, so a lock on a file under it is shared
# by inode and only one integration proceeds at a time.
TASKPUMP_PUMP_TRUNK=auto/trunk               # (default — tp-pump:190)
TASKPUMP_PUMP_INTEGRATION_BASE=main          # (default — tp-pump:191)
TASKPUMP_TRUNK_LOCK_WAIT=300                 # (default — pump-lib.sh:537)

# ── Monitor ──────────────────────────────────────────────────────────────────
#
# The shipped default title is the generic product name; Arachne keeps the
# frame its operator has always seen.
TASKPUMP_MONITOR_TITLE="Arachne Task Pump"   # (pin; shipped default: TaskPump — tp-monitor:1097)

# Names other things key on: the window class carried by the task viewer the `o`
# key spawns (Hyprland windowrules match on it), the session-notes dirname the
# operator greps by habit, and the cache prefix — kept stable so an upgrade
# cannot strand notes or leave stale caches under a different name. The cache
# base expands when this file is sourced, exactly as the tool's own default does.
TASKPUMP_MONITOR_TASK_CLASS=arachne-task     # (pin; shipped default: taskpump-task — tp-monitor:1718)
TASKPUMP_MONITOR_NOTES_DIRNAME=.arachne-monitor-notes   # (pin; shipped default: .taskpump-monitor-notes — tp-monitor:549)
TASKPUMP_MONITOR_CACHE_BASE="${TMPDIR:-/tmp}/arachne-monitor"   # (pin; shipped default: ${TMPDIR:-/tmp}/taskpump-monitor — tp-monitor:526)

# ── Notifications ────────────────────────────────────────────────────────────
#
# TASKPUMP_NOTIFY_CMD is deliberately left unset. Unset, the pump already
# delivers desktop notifications: it falls back to
# `notify-send <prog-name> <message>` whenever notify-send is on PATH
# (tp-pump:1553) — title `arachne-pump`, via the TASKPUMP_PUMP_PROG_NAME pin
# above. Setting the key changes the CONTRACT, not just the command: a
# configured command receives the message on STDIN (tp-pump:1552), and bare
# `notify-send` does not read stdin — an earlier revision of this file named it
# here, which made every drain/deadlock/escalation notice error out, swallowed,
# and silently vanish. Configure a command here only if it reads stdin; set it
# to `true` to silence notifications entirely (the test suites do exactly
# that, since several drive code paths that would otherwise fire one per tick).
