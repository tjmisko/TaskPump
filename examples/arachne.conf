# arachne.conf — the reference consumer's real configuration.
#
# Arachne is the project TaskPump was extracted from on 2026-08-06, and remains
# its reference consumer. These are the values a multi-day unattended drain
# actually ran with, not an illustration.
#
# It is here for two reasons. It is the worked example of a fully-configured
# consumer — a Rust workspace, a submodule ledger, Docker-sandboxed agents. And
# most of these keys are not preferences: each one is a default that some earlier
# run got wrong. The comments say which.
#
# Lines marked "# (default)" set a key to the value the tool ships with today.
# They are load-bearing, not decorative: the v0.1.0 default flips move every
# Arachne-shaped baked-in default to a neutral TaskPump spelling, and these pins
# are what hold this consumer's behavior fixed while that happens. The reasoning
# attached to each is still worth reading — but unlike when this file was first
# written, something WOULD change without them.
#
# To use: copy to `taskpump.conf` at the root of the Arachne checkout.

# ── Ledger ───────────────────────────────────────────────────────────────────
#
# The ledger lives in the `ops/` submodule — a SEPARATE repository from the code.
# That split is deliberate: task state churns on every claim and heartbeat, and
# mixing that traffic into the code repository's history makes both harder to
# read. It is also why TASKPUMP_CODE_REPO must be set independently below.
TASKPUMP_TASKS_DIR=ops/task-loop/tasks
TASKPUMP_LEDGER_REPO=ops

# How a workspace is recognized as having its own ledger. Every worktree carries
# both its own copy of the tools AND its own ops/ checkout, so "which ledger does
# this invocation write to" is answered by probing $PWD's worktree for this path.
# Getting this wrong is the 2026-08-01 incident: the primary checkout's CLI, run
# from inside a worktree, wrote that worktree's claim into the PRIMARY's ledger.
# The work was in one place and the record of it in another, and the primary's
# ledger drifted 46 commits ahead of anything it described.
TASKPUMP_LEDGER_PROBE=ops/task-loop/tasks    # (default)

# The repository whose commits the heartbeat productivity check measures — the
# code, not the ledger. Every ledger mutation is itself a commit, so pointing
# this at the ledger would make every heartbeat look productive and disarm the
# consecutive-failure tripwire entirely.
TASKPUMP_CODE_REPO=.                         # (default: the resolved repo root)

# Phase-anchored ids: F45, F45.23. Arachne deliberately has no parallel #N
# scheme — one id space, anchored to the phase that owns the work.
TASKPUMP_ID_PATTERN='^F[0-9]+(\.[0-9]+)?$'   # (default)

# The parsing half of the same grammar: what the monitor and the DAG renderer
# split an id on to group it under a phase. ID_PATTERN says which ids are valid;
# these say where the phase ends. All three have to agree.
TASKPUMP_PHASE_SIGIL=F                       # (default)
TASKPUMP_PHASE_SEPARATOR=.                   # (default)

# Reclaim a claim whose last heartbeat is older than this. Catches the case
# process-liveness cannot see: a container that is alive but hung, which will
# never fire another heartbeat and would otherwise hold its claim forever.
TASKPUMP_CLAIM_STALE_HOURS=24                # (default)

# Push ledger state as it changes, so a supervisor watching from elsewhere sees
# claims and completions live. Contended pushes retry with jittered backoff —
# a dozen agents pushing small commits to one ref collide constantly.
TASKPUMP_TASK_PUSH=1
TASKPUMP_PUSH_RETRIES=6                      # (default)

# The identity on ledger commits, and the name the CLI answers to in its own
# diagnostics. Historical spellings, pinned: bookkeeping stays separable from
# authored work only if the author string is uniform across the whole ledger
# history, and anything scraping logs by the diagnostic prefix keeps matching.
TASKPUMP_COMMITTER_NAME=arachne-task         # (shipped default: tp-task)
TASKPUMP_COMMITTER_EMAIL=task@arachne.local  # (shipped default: task@taskpump.local)
TASKPUMP_PROG_NAME=arachne-task              # (shipped default: tp-task)

# The pump's self-identity is the same promise one tool over: its diagnostic
# prefix, the plan header, the notify-send title, and the transient systemd
# unit name all derive from this key, and operators script against
# `journalctl --user -u arachne-pump-*` and grep the pump log by the prefix.
TASKPUMP_PUMP_PROG_NAME=arachne-pump         # (shipped default: tp-pump)

# ── Workspaces ───────────────────────────────────────────────────────────────
#
# TASKPUMP_WORKTREES_DIR is deliberately left unset. The pump reads it as a path
# and the monitor and cleanup read it as a bare directory name, so one value
# cannot be right for all three; each tool's own default already resolves to the
# same `.worktrees` under the repo root.
TASKPUMP_BRANCH_PREFIX=feat/                 # (default)
TASKPUMP_PUMP_BASE=main                      # (default)

# ── Runner ───────────────────────────────────────────────────────────────────
#
# Docker, with the hardened reference runner. TASKPUMP_RUNNER is a path to an
# executable, not a runner name — the shipped claude-docker runner is the
# default, so this stays commented.
# TASKPUMP_RUNNER=/path/to/runners/claude-docker/runner.sh
#
# The agent-name prefix is what liveness enumeration matches on, so it must be
# distinctive on the host — the pump asks "which containers are alive", never
# "which tasks say in_progress". The trailing dash is part of the value.
TASKPUMP_IMAGE=arachne                       # (default)
TASKPUMP_AGENT_PREFIX=arachne-agent-         # (default)
TASKPUMP_ENTRYPOINT=/entrypoint-parallel.sh  # (default)

# How an agent invokes the ledger CLI from its workspace — two keys, one path.
# TASKPUMP_TASK_CLI is the spelling the pump quotes into briefs;
# TASKPUMP_WORKSPACE_TASK_CLI is what the entrypoint actually execs inside the
# container. Arachne vendors the CLI in-repo, so both stay the checked-in script.
TASKPUMP_TASK_CLI=scripts/arachne-task            # (default)
TASKPUMP_WORKSPACE_TASK_CLI=scripts/arachne-task  # (default)

# Project-shaped setup between "container exists" and "agent starts": the Rust
# toolchain on PATH, then the image smoke test. Keeping this in a consumer hook
# is what lets the runner itself stay generic. The path is resolved INSIDE the
# container, where the entrypoint has already cd'd to the workspace — so this
# relative path names a script in the checkout, not on the host.
TASKPUMP_PRE_FLIGHT=./scripts/taskpump-preflight.sh

# ── Build gate ───────────────────────────────────────────────────────────────
#
# What must pass before work is integrated. `cargo check --workspace` catches the
# cross-crate breakage that batch-merging parallel branches produces: each branch
# is clean against main on its own, and the sibling struct-literal cascades only
# appear once two of them are on the same tree.
TASKPUMP_BUILD_GATE='cargo check --workspace && ./smoke_test.sh'

# Reclaim build output from a finished workspace each tick. A Rust target/ dir is
# gigabytes; a multi-day drain across several worktrees has filled a disk (195G,
# 100% used, observed). `cargo clean` is used where a manifest exists so nothing
# unrecoverable is ever removed.
TASKPUMP_RECLAIM_CMD='cargo clean'
TASKPUMP_DISK_RECLAIM=1                      # (default)

# What a task must leave green before it may be called done. Quoted into every
# brief, so the agent is told the bar rather than inferring it. The shipped
# default is already these two; naming them here keeps the brief honest if the
# tool's default ever generalizes away from Rust.
TASKPUMP_VERIFY_CMDS='cargo fmt --all
cargo clippy --workspace -- -D warnings'

# ── Briefs ───────────────────────────────────────────────────────────────────
#
# One parameterized template for every phase, rather than a hand-written brief
# per worktree. The agent reads the task file itself for goal, scope, and
# acceptance — so a range run needs no manifest and no per-phase authoring.
TASKPUMP_BRIEF_TEMPLATE=ops/task-loop/briefs/_phase-drain-template.md

# ── Pump ─────────────────────────────────────────────────────────────────────
#
# Concurrency is capped and rotated, not bursted. The cap is a hardware limit,
# not a preference: this host's Apple-Silicon WiFi firmware wedges under the
# aggregate packet load of ~10 simultaneous streaming agents (RX-ring SKB
# starvation, cleared only by a device reset). Six is the proven ceiling.
TASKPUMP_JOBS=6
TASKPUMP_POOL_CAP_FILE=.arachne-pool-cap     # (default, relative to the state dir)

# No-progress resumes of a stalled claim before escalating to a human. A resume
# that produces a commit resets the count, so this bounds futility rather than
# duration — a task legitimately needing many sessions is never escalated.
TASKPUMP_PUMP_RESUME_MAX=3                   # (default)

# Consecutive fully-deadlocked ticks before exiting 3. Greater than one so a
# container dying mid-tick cannot trip it. Before this existed, a pump idled 563
# ticks over seven hours on a single orphaned claim while systemd reported it
# healthy — the incident the whole resume mechanism comes from.
TASKPUMP_PUMP_STALL_EXIT_TICKS=3             # (default)

# The state file's NAME within the state dir. TASKPUMP_PUMP_STATE_FILE is the
# other key — an absolute path that overrides the state dir entirely — and a
# bare filename there would resolve against the current directory instead.
TASKPUMP_PUMP_STATE_NAME=.arachne-pump.state # (default)

# Every other file a run drops, under its historical name. The agent-log NAME is
# load-bearing twice over: the monitor and the cleanup sweeper find a live agent
# by this filename, so a rename landing mid-drain would make running agents
# invisible to both. The last four resolve like the pool cap above: the shipped
# default puts each in the state dir, and Arachne runs the pump from the repo
# root, where the state dir already is.
TASKPUMP_AGENT_LOG_NAME=.arachne-agent.log   # (default)
TASKPUMP_BRIEF_OUT_NAME=.arachne-phase-brief.md   # (default)
TASKPUMP_GOAL_NOTE_NAME=.arachne-goal.md     # (default)
TASKPUMP_RESUME_NOTE_NAME=.arachne-resume.md # (default)
TASKPUMP_RO_PROBE_FILE=.arachne-rotest       # (default)
TASKPUMP_PUMP_LOG=.arachne-pump.log          # (default, relative to the state dir)
TASKPUMP_USAGE_RESET_FILE=.arachne-usage-reset    # (default, relative to the state dir)
TASKPUMP_DISK_WATCHDOG_LOG=.arachne-disk-watchdog.log   # (default, relative to the state dir)
TASKPUMP_HOOK_MARK_FILE=.arachne-fsguard.notified       # (default, relative to the state dir)

# ── Gates ────────────────────────────────────────────────────────────────────
#
# Arachne runs the default chain, so TASKPUMP_GATES is deliberately NOT set. The
# key takes newline-separated command lines whose first word is an executable
# path — a comma-separated list of bare gate names is skipped entry by entry with
# a warning, and a skipped gate reads exactly like a gate that passed. Setting it
# also REPLACES the chain rather than adding to it, so the way to drop one gate
# is its own enable flag below, not this key.
#
# The default chain, cheapest-first; the first gate to pause short-circuits it:
#
#   net-health          host WiFi wedge — HOST HARDWARE POLICY. A generic
#                       consumer drops this (TASKPUMP_HEALTH_GATE=0); it matches
#                       brcmfmac firmware signatures specific to this machine.
#                       Its recovery half (the modprobe reset) deliberately stays
#                       consumer-side in arachne-net-watchdog: detecting is a
#                       feed decision, reloading a kernel module is not
#                       TaskPump's business.
#   claude-token-fresh  containers are access-token-only and cannot self-refresh,
#                       so launching one against an expiring host token yields an
#                       agent that 401s immediately and burns a relaunch cycle.
#   claude-usage        plan utilization ceiling — what makes a multi-day drain
#                       self-throttling instead of plan-exhausting.
#   disk-low            free space floor, shared with the reclaim threshold.
TASKPUMP_HEALTH_GATE=1                       # (default)
TASKPUMP_TOKEN_GATE=1                        # (default)
TASKPUMP_TOKEN_MARGIN_S=600                  # (default)
TASKPUMP_USAGE_GATE=1                        # (default)
TASKPUMP_USAGE_CEILING=95                    # (default)
TASKPUMP_DISK_GATE=1                         # (default)

# ── Pre-tick hooks ───────────────────────────────────────────────────────────
#
# Also left unset, and for the same two reasons: the value is newline-separated
# command lines, and setting it replaces the default pair rather than extending
# it. Both shipped hooks are ones Arachne needs, so replacing the chain to name
# them is a way to lose them.
#
#   gitignore-repair the `gh worktree` extension appends a bare `.worktrees/`
#                    ignore line on every create, which sits after the negations
#                    that keep worktrees visible and silently re-ignores them.
#                    Left alone it produces a perpetually-dirty tree and a
#                    self-triggering guard loop; it has stalled a live pump and
#                    burned multiple rescue sessions.
#   fs-guard         contamination detector. With the primary checkout mounted
#                    read-only a container cannot write it, so this should always
#                    be clean — it is the regression detector for a future mount
#                    change that re-widens the mount.
#
# Fast-forwarding ops/ and running `scrub` are NOT hooks: the pump does both
# itself at the top of every tick, before the hook chain runs.

# Paths allowed to be dirty in the primary checkout. Anything else dirty means a
# container wrote where it should not have. The trunk's lock and quarantine files
# are in the list because the integration trunk below writes them into the repo
# root every merge — dropping them makes fs-guard fire on the pump's own work.
TASKPUMP_FS_GUARD_ALLOWLIST='^(\.worktrees/|ops$|ops/|\.auto-trunk\.lock$|\.auto-trunk-quarantine$)'   # (default)

# ── Integration trunk (opt-in, default OFF) ──────────────────────────────────
#
# When enabled, phase worktrees are cut from a continuously-integrated trunk
# rather than a stale base, each quiescent phase merges into it behind the build
# gate, and the drain graduates as one PR. The flock is the merge queue: every
# container shares the bind-mounted repo, so a lock on a file under it is shared
# by inode and only one integration proceeds at a time.
TASKPUMP_PUMP_TRUNK=auto/trunk               # (default)
TASKPUMP_PUMP_INTEGRATION_BASE=main          # (default)
TASKPUMP_TRUNK_LOCK_WAIT=300                 # (default)

# ── Monitor ──────────────────────────────────────────────────────────────────
#
# The shipped default title is the generic product name; Arachne keeps the
# frame its operator has always seen.
TASKPUMP_MONITOR_TITLE="Arachne Task Pump"

# Names other things key on: the window class carried by the task viewer the `o`
# key spawns (Hyprland windowrules match on it), the session-notes dirname the
# operator greps by habit, and the cache prefix — kept stable so an upgrade
# cannot strand notes or leave stale caches under a different name. The cache
# base expands when this file is sourced, exactly as the tool's own default does.
TASKPUMP_MONITOR_TASK_CLASS=arachne-task     # (shipped default: taskpump-task)
TASKPUMP_MONITOR_NOTES_DIRNAME=.arachne-monitor-notes   # (default)
TASKPUMP_MONITOR_CACHE_BASE="${TMPDIR:-/tmp}/arachne-monitor"   # (default)

# ── Notifications ────────────────────────────────────────────────────────────
#
# Desktop notification on drain, deadlock, and escalation. Set to `true` to
# silence — the test suites do exactly that, since several drive code paths that
# would otherwise fire a notification per tick. Leaving it unset falls back to
# notify-send anyway when it is on PATH; naming it makes that explicit and gives
# somewhere obvious to change.
TASKPUMP_NOTIFY_CMD=notify-send              # (default, when notify-send exists)
